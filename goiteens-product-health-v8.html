function layout(html){E('app').innerHTML=`<div class="app">${side()}<main class="main">${topHeader()}<div class="content page-narrow">${html}</div><div class="footer">GoITeens · Product Health · концепт інтерфейсу v6.0 · усі дані демонстраційні</div></main></div>`}
function hero(){return `<section class="hero"><div><div class="eyebrow">${icon('radar',13)} ПРОДУКТОВІ СИГНАЛИ</div><h2>Побачити зміни. Зрозуміти, де потрібна дія.</h2><p>Важливі відхилення та покращення за курсами. Від сигналу — до продукту, когорти й даних для перевірки.</p></div><div class="hero-tip"><b>Ключовий принцип</b>Не всі зміни є проблемою. Враховуємо поріг, обсяг вибірки та контекст. Покращення теж варто досліджувати.</div></section>`}
function counters(a){
const negative=a.filter(s=>s.kind==='negative'), positive=a.filter(s=>s.kind==='positive');
const affected=new Set(negative.map(s=>s.prod)).size;
return `<div class="stat-grid">
<button class="stat clickable" type="button" data-tone="negative" data-go-signals="1" aria-label="Показати сигнали уваги"><div class="stat-top">Сигналів уваги <span class="stat-icon" style="color:var(--red)">${icon('alert',16)}</span></div><div class="stat-num">${negative.length}</div><div class="stat-sub">Відхилення, які варто перевірити ${icon('arrow',15)}</div></button>
<button class="stat clickable" type="button" data-tone="positive" data-go-signals="1" aria-label="Показати позитивні зміни"><div class="stat-top">Позитивних змін <span class="stat-icon" style="color:var(--green)">${icon('up',16)}</span></div><div class="stat-num">${positive.length}</div><div class="stat-sub">Практики, які варто вивчити ${icon('arrow',15)}</div></button>
<button class="stat clickable" type="button" data-map-risk="1" aria-label="Показати ${affected} курсів з ризиком на карті продуктів"><div class="stat-top">Курсів з ризиком <span class="stat-icon" style="color:var(--red)">${icon('book',16)}</span></div><div class="stat-num">${affected}</div><div class="stat-sub">Із ${PRODUCTS.length} курсів у демо ${icon('arrow',15)}</div></button>
</div>`;
}
function attentionFilters(){return `<div class="card filters"><div class="seg"><button data-tone="all" class="${state.tone==='all'?'active':''}">Усі</button><button data-tone="negative" class="${state.tone==='negative'?'active':''}">${icon('alert',12)} Проблеми</button><button data-tone="positive" class="${state.tone==='positive'?'active':''}">${icon('up',12)} Покращення</button></div><select class="field" data-attention-direction aria-label="Фільтр за напрямом"><option value="all">Усі напрями</option>${DIRECTIONS.map(d=>`<option value="${d.id}" ${state.attentionDirection===d.id?'selected':''}>${d.name}</option>`).join('')}</select><select class="field" data-dim aria-label="Тип показника"><option value="all" ${state.dim==='all'?'selected':''}>Усі показники</option>${DIM_KEYS.map(k=>`<option value="${k}" ${state.dim===k?'selected':''}>${DIM[k].label}</option>`).join('')}</select><label class="search-wrap">${icon('search',14)}<input data-search="attention" placeholder="Знайти курс або сигнал" value="${esc(state.query)}" aria-label="Пошук сигналів"></label></div>`}
function signalCard(s){let p=P(s.prod),pos=s.kind==='positive';return `<article class="card signal ${pos?'positive':''}" role="button" tabindex="0" data-open-product="${p.id}" data-focus="${s.id}" aria-label="Відкрити паспорт ${p.name} — ${esc(s.title)}"><div class="stripe"></div><div><div class="signal-top"><div><div class="signal-company">${p.name}</div><div class="mini-meta">${Direction(p.direction)?.name||'Інший напрям'} / ${DIM[s.dim].label} · ${s.cohort}</div></div><div class="badges"><span class="tag ${pos?'positive':'negative'}">${pos?icon('up',11):icon('alert',11)} ${signalLabel(s)}</span></div></div><div class="signal-title">${s.title}</div><div class="metric-line"><span class="change">${signalChange(s)}</span><span class="quiet">${esc(s.metric)} · ${signalDiff(s)}</span></div><p class="explain">${esc(s.summary)}</p><div class="signal-footer"><span class="footnote">Основа: ${s.sample} ${s.sampleType} · ${s.source[0]}</span><div class="actions"><button class="btn sm primary" data-open-product="${p.id}" data-focus="${s.id}">Відкрити паспорт ${icon('arrow',14)}</button></div></div></div></article>`}
function railHelp(){return `<div class="card rail-card"><div class="rail-header">${icon('info',17)}<h3>Як читати сигнали</h3></div><div class="data-point-list"><div class="data-point"><span class="circleicon" style="background:var(--redBg);color:var(--red)">${icon('trend',14)}</span><div><b>Потребує уваги</b><br>Помітне погіршення. Це сигнал для перевірки, а не встановлена причина.</div></div><div class="data-point"><span class="circleicon" style="background:var(--greenBg);color:var(--green)">${icon('up',14)}</span><div><b>Позитивна зміна</b><br>Варто зрозуміти, що спрацювало, і чи можна масштабувати результат.</div></div><div class="data-point"><span class="circleicon">${icon('layers',14)}</span><div><b>Деталізація</b><br>Перехід до когорт, місяців, викладачів, відгуків і першоджерел.</div></div></div></div>`}
function spotlights(a){let candidates=[a.find(s=>s.id==='mc-drop'),a.find(s=>s.id==='art-cor')];let fallback=[a.find(s=>s.kind==='negative'),a.find(s=>s.kind==='positive')];return `<div class="spotlights">${candidates.map((s,i)=>s||fallback[i]).filter(Boolean).map(s=>`<div class="spotlight ${s.kind==='positive'?'good':''}" role="button" tabindex="0" data-open-product="${s.prod}" data-focus="${s.id}"><div><div class="spot-cap">${s.kind==='positive'?'↑ ПОКРАЩЕННЯ, ЯКЕ ВАРТО ДОСЛІДИТИ':'! СИГНАЛ, ЯКИЙ ВАРТО ПЕРЕВІРИТИ'}</div><div class="spot-title">${P(s.prod).name} · ${s.title}</div><div class="spot-meta">${s.metric} · ${signalDiff(s)}</div></div><div style="display:flex;align-items:center;gap:12px"><div class="spot-val">${signalChange(s)}</div><button class="btn sm" data-open-product="${s.prod}" data-focus="${s.id}">${icon('chev',14)}</button></div></div>`).join('')}</div>`}
function attention(){let a=activeSignals(), list=a.filter(s=>(state.tone==='all'||s.kind===state.tone)&&(state.dim==='all'||s.dim===state.dim)&&(state.attentionDirection==='all'||P(s.prod)?.direction===state.attentionDirection)&&(!state.query||(P(s.prod).name+' '+s.title+' '+DIM[s.dim].label).toLocaleLowerCase('uk').includes(state.query.toLocaleLowerCase('uk'))));list.sort((a,b)=>{let first=x=>x.kind==='negative'?0:1;return first(a)-first(b)||Math.abs(b.delta)-Math.abs(a.delta)});let blocks=list.length?list.map(signalCard).join(''):`<div class="empty">${icon('search',33)}<h3>Сигналів за вибраними фільтрами немає</h3><p>Спробуйте змінити напрям або пошук.</p></div>`;layout(`<div class="heading-row"><div><h1>Центр уваги</h1></div><button class="btn" data-nav="map">${icon('grid',15)} Переглянути всі продукти</button></div>${hero()}${counters(a)}${spotlights(a)}<div class="columns"><section><div id="current-signals" class="section-head"><div><h2>Актуальні сигнали</h2><div class="section-sub">${list.length} із ${a.length} сигналів у поточному відборі</div></div></div>${attentionFilters()}<div class="feed">${blocks}</div></section><aside class="rail">${railHelp()}<div class="callout"><b>Примітка.</b> Логіку порогів і правил спрацювання винесемо в окреме технічне обговорення. Тут фокус лише на структурі й навігації майбутнього дашборда.</div></aside></div>`)}
function mapFilterBar(){return `<div class="map-top"><div class="seg"><button data-mapfilter="all" class="${state.mapFilter==='all'?'active':''}">Усі (${PRODUCTS.length})</button><button data-mapfilter="risk" class="${state.mapFilter==='risk'?'active':''}">Потребують уваги</button><button data-mapfilter="positive" class="${state.mapFilter==='positive'?'active':''}">Є покращення</button></div><label class="search-wrap" style="flex:0 1 270px">${icon('search',14)}<input data-search="map" placeholder="Пошук напряму або курсу" value="${esc(state.mapQuery)}" aria-label="Пошук напрямів і курсів"></label><div class="seg" style="margin-left:auto"><button data-map-grouping="directions" class="${state.mapGrouping==='directions'?'active':''}">За напрямами</button><button data-map-grouping="courses" class="${state.mapGrouping==='courses'?'active':''}">Усі курси</button></div>${state.mapGrouping==='courses'?`<div style="display:flex;gap:6px"><button class="btn sm ${state.mapMode==='cards'?'primary':''}" data-mapmode="cards" aria-label="Картки">${icon('grid',15)}</button><button class="btn sm ${state.mapMode==='table'?'primary':''}" data-mapmode="table" aria-label="Таблиця">${icon('list',15)}</button></div>`:''}</div>`}
function overviewBar(status){let color=status==='risk'?'#df6d66':status==='positive'?'#2f9a77':status==='unknown'?'#d4d7df':'#8994a8';return `<div class="overview-bar" style="--c:${color}"></div>`}
function overviewBlock(list){let dirs=visibleDirections();return `<section class="card dir-overview"><div class="row-flex" style="align-items:flex-start;margin-bottom:14px"><div><h2>Огляд напрямів</h2><p class="section-sub">Стан усієї продуктової лінійки. Натисніть на напрям, щоб розкрити його курси нижче.</p></div><span class="tag">${dirs.length} напрямів · ${list.length} курсів у відборі</span></div>${dirStatusLegend()}<div class="dir-overview-grid">${dirs.map(d=>{const a=directionSummary(d.id);return `<button class="dir-mini" data-jump-direction="${d.id}" type="button"><div class="row-flex"><strong>${d.name}</strong><span class="dir-mini-meta">${a.products.length} ${nounForm(a.products.length,'курс','курси','курсів')}</span></div>${dirBars(d.id)}<div class="dir-mini-foot"><span>${a.risk?`${a.risk} ${nounForm(a.risk,'негативний сигнал','негативні сигнали','негативних сигналів')}`:'Без негативних сигналів'}</span><span>${a.positive?`↑ ${a.positive} ${nounForm(a.positive,'покращення','покращення','покращень')}`:''} ${icon('chev',14)}</span></div></button>`}).join('')}</div></section>`}

function groupCourseRow(p){const a=activeSignals().filter(s=>s.prod===p.id);return `<div class="group-course" data-open-product="${p.id}" tabindex="0" role="button" aria-label="Відкрити паспорт курсу ${p.name}"><div class="group-course-main"><strong>${p.name}</strong><span>${p.segment} · ${p.students} записів</span></div><div class="group-course-bars">${DIM_KEYS.map(k=>`<span title="${DIM[k].label}: ${statusName(dimensionStatus(p,k))}" style="background:${dimensionStatus(p,k)==='risk'?'#d26461':dimensionStatus(p,k)==='positive'?'#2e9976':dimensionStatus(p,k)==='unknown'?'#cfd3df':'#a8afbf'}"></span>`).join('')}</div><span class="group-course-signals">${a.length?`${a.length} сигналів`:'Без нових сигналів'}</span><span class="group-course-arrow">${icon('arrow',17)}</span></div>`}
function directionGroup(d){const sum=directionSummary(d.id),expanded=state.expandedDirections.includes(d.id),q=state.mapQuery.trim().toLocaleLowerCase('uk');let shown=sum.products.filter(p=>(q&&!d.name.toLocaleLowerCase('uk').includes(q))?p.name.toLocaleLowerCase('uk').includes(q):true);return `<section class="card direction-group" id="direction-${d.id}"><div class="direction-group-top"><button class="direction-group-toggle" data-toggle-direction="${d.id}" aria-expanded="${expanded}">${icon(expanded?'down':'chev',19)}<span class="direction-group-title"><strong>${d.name}</strong><small>${sum.products.length} курсів · ${sum.students} активних записів · ${sum.groups} груп</small></span></button><div class="direction-group-actions"><span class="group-badge risk">${sum.risk} ${nounForm(sum.risk,'ризик','ризики','ризиків')}</span><span class="group-badge good">${sum.positive} ${nounForm(sum.positive,'покращення','покращення','покращень')}</span><button class="btn sm" data-open-direction="${d.id}">Огляд напряму ${icon('arrow',14)}</button></div></div><div class="direction-group-meter"><span class="meter-label">Утримання · Залученість · Якість · Досвід · Комерція · Операції</span>${dirBars(d.id)}</div>${expanded?`<div class="direction-children">${shown.length?shown.map(groupCourseRow).join(''):'<p style="padding:12px">Курсів за пошуком немає</p>'}</div>`:''}</section>`}
function directionPage(){const d=Direction(state.direction)||DIRECTIONS[0],sum=directionSummary(d.id);layout(`<button class="back-link" data-nav="map" type="button">${icon('back',19)} До карти продуктів</button><div class="heading-row"><div><div class="detail-breadcrumb"><button data-nav="map">Карта продуктів</button>${icon('chev',13)}<span>${d.name}</span></div><h1>${d.name} — огляд напряму</h1><p class="lead">${sum.products.length} курсів в одному напрямі. Показники окремих курсів не приховуються за загальною оцінкою.</p></div></div><div class="stat-grid"><div class="stat"><div class="stat-top">Курсів у напрямі</div><div class="stat-num">${sum.products.length}</div><div class="stat-sub">окремі програми</div></div><div class="stat"><div class="stat-top">Активних записів на курси</div><div class="stat-num">${sum.students}</div><div class="stat-sub">не кількість унікальних дітей</div></div><div class="stat"><div class="stat-top">Сигналів за напрямом</div><div class="stat-num">${sum.risk+sum.positive}</div><div class="stat-sub">${sum.risk} ${nounForm(sum.risk,'ризик','ризики','ризиків')} · ${sum.positive} ${nounForm(sum.positive,'покращення','покращення','покращень')}</div></div></div><section class="card dir-overview"><h2>Стан напрямку за показниками</h2><p class="section-sub">Колір означає, що серед курсів є відповідний сигнал. Це не усереднений рейтинг напряму.</p><div class="direction-aggregates">${DIM_KEYS.map(k=>{const negative=sum.products.filter(p=>dimensionStatus(p,k)==='risk').length;const positive=sum.products.filter(p=>dimensionStatus(p,k)==='positive').length;return `<div class="direction-aggregate"><b>${DIM[k].label}</b>${overviewBar(dirDimStatus(d.id,k))}<span>${negative?`${negative} із ${sum.products.length} курсів із ризиком`:positive?`${positive} курсів із покращенням`:'Без негативних сигналів'}</span></div>`}).join('')}</div></section><section style="margin-top:22px"><div class="section-head"><h2>Курси в напрямі</h2><span class="tag">Натисніть на курс для детального паспорта</span></div><div class="group-course-list">${sum.products.map(groupCourseRow).join('')}</div></section><div class="notice" style="margin-top:18px">У демонстрації агреговано лише кількість записів, груп і сигналів. COR, retention, NPS та інші частки на рівні напряму потрібно розраховувати за узгодженими формулами із первинних даних, а не як середнє значень курсів.</div>`)}

function mapCard(p){let ss=overallStatus(p),cnt=activeSignals().filter(s=>s.prod===p.id).length;return `<article class="card product-card" tabindex="0" role="button" data-open-product="${p.id}" aria-label="Відкрити паспорт ${p.name}"><div class="row-flex"><div><div class="product-title">${p.name}</div><div class="product-meta">${p.segment}</div></div><span class="small-chip">${p.groups} груп</span></div><div class="product-status">${statusDot(ss)}<span style="color:${statusColor(ss)}">${statusName(ss)}</span></div><div class="dimension-grid">${DIM_KEYS.map(k=>{let v=dimensionStatus(p,k);return `<div class="dim"><div class="dim-left">${statusDot(v)}<span>${DIM[k].label}</span></div><span style="color:${statusColor(v)};font-weight:700;font-size:12px">${v==='risk'?'Сигнал':v==='positive'?'↑':v==='unknown'?'Н/Д':'—'}</span></div>`}).join('')}</div><div class="prod-foot"><span>${cnt?`${cnt} сигналів за період`:'Немає нових сигналів'}</span>${icon('arrow',16)}</div></article>`}
function mapTable(list){return `<div class="grid-table"><table class="data-table"><thead><tr><th>Продукт</th><th>Учнів</th>${DIM_KEYS.map(k=>`<th>${DIM[k].short}</th>`).join('')}<th></th></tr></thead><tbody>${list.map(p=>`<tr data-open-product="${p.id}" tabindex="0" role="button" aria-label="Відкрити паспорт ${p.name}"><td><b>${p.name}</b><div style="font-size:13px;color:var(--muted)">${p.segment}</div></td><td>${p.students}</td>${DIM_KEYS.map(k=>{let a=dimensionStatus(p,k);return `<td><span class="status-cell">${statusDot(a)}${a==='risk'?'Сигнал':a==='positive'?'Покращення':a==='unknown'?'Н/Д':'—'}</span></td>`}).join('')}<td>${icon('chev',15)}</td></tr>`).join('')}</tbody></table></div>`}
function map(){const q=state.mapQuery.trim().toLocaleLowerCase('uk');const p=PRODUCTS.filter(x=>passCourseFilter(x)&&(!q||x.name.toLocaleLowerCase('uk').includes(q)||Direction(x.direction)?.name.toLocaleLowerCase('uk').includes(q)));const dirs=visibleDirections();layout(`<div class="heading-row"><div><h1>Карта продуктів</h1><p class="lead">Спочатку напрям, потім окремий курс. Відкрийте напрям, щоб побачити, які саме продукти формують його сигнали.</p></div><button class="btn" data-nav="attention">${icon('radar',15)} До Центру уваги</button></div>${overviewBlock(p)}<div class="map-section-head"><div><h2>${state.mapGrouping==='directions'?'Напрями та курси':'Усі курси'}</h2><div class="section-sub">${dirs.length} напрямів · ${p.length} курсів у вибраному відборі</div></div></div>${mapFilterBar()}${state.mapGrouping==='directions'?`<div class="directions-list">${dirs.length?dirs.map(directionGroup).join(''):'<div class="empty"><h3>Нічого не знайдено</h3></div>'}</div>`:p.length?(state.mapMode==='cards'?`<div class="map-grid">${p.map(mapCard).join('')}</div>`:mapTable(p)):'<div class="empty"><h3>Курсів не знайдено</h3><p>Змініть фільтр або запит.</p></div>'}<div class="notice">Усі цифри демонстраційні. Статуси напрямів показують сигнали хоча б одного з курсів. Відсутність сигналів не доводить якість усіх програм; середні COR та retention без узгодженої методики не розраховуємо.</div>`)}
function plotSVG(points,{pos=false,labels=true}={}){let w=540,h=170,pad=14,min=Math.min(...points)-6,max=Math.max(...points)+6,ys=y=>h-pad-(y-min)/(max-min)*(h-pad*2),xs=i=>pad+i*(w-2*pad)/(points.length-1),path=points.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(2)} ${ys(v).toFixed(2)}`).join(' '),col=pos?'#2c9f7e':'#8066e8';return `<svg class="viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Демонстраційний графік динаміки">${[0,1,2,3].map(i=>`<line x1="0" y1="${25+i*40}" x2="540" y2="${25+i*40}" stroke="#eef0f4" stroke-width="1" stroke-dasharray="4 5"/>`).join('')}<path d="${path}" stroke="${col}" stroke-width="3" stroke-linejoin="round" fill="none"/>${points.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="4" fill="white" stroke="${col}" stroke-width="2.5"/>`).join('')}</svg>${labels?'<div class="viz-labels"><span>Квітень</span><span>Травень</span><span>Червень</span><span>Липень</span><span>Серпень</span><span>Вересень</span><span>Жовтень</span></div>':''}`}
const ZOHO_REPORTS={
 overview:[{id:'cor',title:'COR та retention',description:'Динаміка утримання за продуктом, когортами й місяцями навчання.',filter:'Курс, когорта, період'},{id:'drop',title:'Причини дропу',description:'Причини виходу, перший місяць та розподіл відтоку.',filter:'Курс, місяць навчання, період'}],
 retention:[{id:'cor',title:'COR та retention',description:'Утримання за когортами, етапами навчання та порівняння періодів.',filter:'Курс, когорта, місяць навчання'},{id:'drop',title:'Drop / причини виходу',description:'Перший місяць, етап виходу, причина, випуск та переходи.',filter:'Курс, причина, період'}],
 engagement:[{id:'attendance',title:'Відвідуваність занять',description:'Присутність та пропуски за групами, викладачами й уроками.',filter:'Курс, група, заняття'},{id:'hw',title:'Виконання домашніх завдань',description:'Виконані й невиконані ДЗ за модулями та когортами.',filter:'Курс, модуль, група'}],
 teachers:[{id:'teachers',title:'Показники викладачів',description:'Порівняння груп, оцінки занять, стабільність результатів.',filter:'Курс, викладач, когорта'},{id:'reviews',title:'Оцінки навчальних матеріалів',description:'Зворотний зв’язок викладачів щодо сценаріїв уроків та змісту.',filter:'Курс, модуль, урок'}],
 experience:[{id:'feedback',title:'Фідбек батьків та учнів',description:'Оцінки занять, задоволеність та коментарі.',filter:'Курс, когорта, період'},{id:'complaints',title:'Звернення та скарги',description:'Категорії звернень, причини незадоволення та повторювані теми.',filter:'Курс, тема звернення, період'}],
 business:[{id:'sales',title:'Продажі та конверсія',description:'Ліди, нові оплати, конверсія, план-факт та динаміка попиту.',filter:'Курс, канал, період'},{id:'operations',title:'Групи та наповнюваність',description:'Кількість груп, розклад, доступні місця й операційні обмеження.',filter:'Курс, група, період'}]
};
function zohoLinks(p,tab=state.tab){let reports=ZOHO_REPORTS[tab]||ZOHO_REPORTS.overview;return `<section class="zoho-panel"><div class="zoho-head"><div><h3>Детальні звіти в Zoho</h3><p>У робочій версії відкриємо відповідний звіт із фільтром за курсом та періодом.</p></div><span class="tag">Демо-переходи</span></div><div class="zoho-buttons">${reports.map(r=>`<button type="button" class="zoho-button" data-zoho="${r.id}" data-product="${p.id}" data-report-tab="${tab}">${icon('link',15)} ${r.title} ${icon('arrow',13)}</button>`).join('')}</div></section>`}
function insightTile(s,positive){return `<div class="ai-insight ${positive?'good':'bad'}"><h3>${icon(positive?'up':'alert',17)} ${positive?'Позитивна зміна':'Потребує уваги'}</h3>${s?`<p><b>${esc(s.title)}.</b> ${esc(s.metric)}: ${signalDiff(s)} (${signalChange(s)}).</p><button class="btn sm" data-open-diagnostic="${s.id}">Детальна AI-діагностика ${icon('arrow',13)}</button>`:`<p>${positive?'За обраними демоправилами немає зафіксованого суттєвого покращення.':'Немає суттєвих негативних сигналів за поточними демоправилами.'}</p><p class="ai-small">Відсутність сигналу не гарантує, що все добре.</p>`}</div>`}
function aiProductOverview(p){let ss=activeSignals().filter(s=>s.prod===p.id);let neg=ss.find(s=>s.kind==='negative'),pos=ss.find(s=>s.kind==='positive'),first=neg||pos;let suggestions=first?first.check.slice(0,2):['Перевірити повноту даних у звітах','Порівняти показники з відповідними когортами та періодами'];return `<section class="ai-overview"><div class="ai-header"><div class="ai-heading"><div class="ai-mark">${icon('spark',22)}</div><div><div class="ai-title">AI-огляд продукту</div><div class="ai-sub">${p.name} · Жовтень 2026 · приклад аналітичної інтерпретації</div></div></div><span class="ai-demo">Приклад майбутнього AI · не згенеровано наживо</span></div><div class="ai-grid">${insightTile(neg,false)}${insightTile(pos,true)}<div class="ai-insight"><h3>${icon('search',17)} Що варто перевірити</h3><ul class="bullets">${suggestions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p class="ai-small">Це напрямки перевірки, а не встановлені причини.</p></div></div><div class="ai-foot"><span>Основа: умовні сигнали та демонстраційні дані паспорта</span><span>Для роботи потрібні Zoho API, перевірені формули та окрема AI-інтеграція</span></div></section>`}
function aiDiagnostic(s){let hypothesis=s.kind==='negative'?'Погіршення може бути пов’язане зі змінами в окремих когортах, навчальному процесі або умовах набору.':'Покращення може бути пов’язане зі змінами навчального процесу або складу когорт. Потрібно перевірити, що саме вплинуло на результат.';return `<section class="ai-diagnostic"><div class="ai-diagnostic-head"><div class="ai-heading"><div class="ai-mark">${icon('spark',20)}</div><div><div class="ai-title" style="font-size:20px">Детальна AI-діагностика</div><div class="ai-sub">Приклад структури висновків · реальний AI поки не підключено</div></div></div><span class="tag">Гіпотези ≠ причини</span></div><div class="ai-diagnostic-grid"><div class="ai-diag-item"><h3>Що показують дані</h3><ul>${s.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="ai-diag-item"><h3>Можливе пояснення</h3><p>${hypothesis}</p><p style="font-size:12px;color:#8b809d">Причинний зв’язок не доведено.</p></div><div class="ai-diag-item"><h3>Що перевірити далі</h3><ul>${s.check.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section>`}
function zohoModal(reportId,prodId,tab){const p=P(prodId)||PRODUCTS[0];const entry=(ZOHO_REPORTS[tab]||ZOHO_REPORTS.overview).find(x=>x.id===reportId);if(!entry)return;let overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='zoho-modal';overlay.innerHTML=`<div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="zoho-modal-title"><button class="modal-close" type="button" aria-label="Закрити" data-close-zoho="1">${icon('x',17)}</button><div class="label">Перехід до першоджерела · демо</div><h2 id="zoho-modal-title">${esc(entry.title)}</h2><p>${esc(entry.description)}</p><div class="modal-info"><div><b>Продукт:</b> ${esc(p.name)}</div><div><b>Період:</b> жовтень 2026</div><div><b>Потрібні фільтри:</b> ${esc(entry.filter)}</div></div><p><b>Посилання ще не підключене.</b> У робочій версії ця кнопка відкриватиме відповідний звіт Zoho з уже вибраним курсом та періодом. Жодні дані зараз не передаються.</p><div class="modal-actions"><button class="btn primary" type="button" data-close-zoho="1">Зрозуміло</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('.modal-close').focus()}
function kpis(p){let k=p.kpi,items=[

function productSignals(p){let a=activeSignals().filter(s=>s.prod===p.id);return a.length?`<div class="mini-signals">${a.map(s=>`<div class="mini-signal" role="button" tabindex="0" data-open-diagnostic="${s.id}"><div><b style="color:${s.kind==='positive'?'var(--green)':'var(--red)'}">${signalChange(s)} · ${s.metric}</b><p>${s.title}</p></div><button class="btn sm" data-open-diagnostic="${s.id}">${icon('search',13)} Деталі</button></div>`).join('')}</div>`:'<p class="lead">За поточними демо-порогами нових сигналів немає.</p>'}

function tabPaneContent(p){let signals=activeSignals().filter(s=>s.prod===p.id),kind=state.tab; if(kind==='overview')return `<div class="panel-grid"><div class="panel"><div class="row-flex"><h3>Динаміка COR за 7 місяців</h3><span class="tag">Демо</span></div>${plotSVG(p.trend)}<div class="notice">На відміну від LTV компанії, COR відображається саме для цього курсу. Формула та правила порівняння ще мають бути погоджені.</div></div><div class="panel"><h3>Сигнали курсу</h3><p class="section-sub" style="margin-bottom:14px">Відкрийте будь-яку зміну для деталізації</p>${productSignals(p)}</div></div><div class="panel section-spacer"><h3>Розподіл за когортами</h3>${cohortTable(p)}<div class="section-sub" style="margin-top:10px">Це приклад деталізації — значення не пов’язані з реальними учнями GoITeens.</div></div>`;
 if(kind==='retention')return `<div class="panel-grid"><div class="panel"><h3>Утримання за місяцями</h3>${plotSVG(p.trend)}<p class="section-sub">Важливо відокремлювати незапланований дроп, випуск та перехід на інший курс.</p><div class="section-spacer"><h3>Утримання і ранній дроп</h3><div class="data-point-list"><div class="data-point">${icon('bars',16)} COR: <b>${p.kpi.cor}%</b></div><div class="data-point">${icon('alert',16)} Дроп першого місяця: <b>${p.kpi.drop}%</b></div></div></div></div><div class="panel"><h3>Що перевіряти</h3><ul class="bullets"><li>Порівняння коректних когорт, у тому числі розміру вибірки</li><li>Розподіл відтоку за місяцями й модулями</li><li>Причини виходу, завершення та міграції</li><li>Початковий вибір курсу клієнтом</li></ul><h3 style="margin-top:22px">Доступні сигнали</h3><div class="section-spacer">${productSignals(p)}</div></div></div>`;
 if(kind==='engagement')return `<div class="panel-grid"><div class="panel"><h3>Активність учнів за когортами</h3>${cohortTable(p)}<p class="section-sub" style="margin-top:10px">У робочій версії — деталізація за уроками й модулями.</p></div><div class="panel"><h3>Індикатори залученості</h3><div class="data-point-list"><div class="data-point"><span class="circleicon">${icon('calendar',14)}</span>Відвідуваність: <b>${p.kpi.attendance}%</b></div><div class="data-point"><span class="circleicon">${icon('check',14)}</span>Виконання ДЗ: <b>${p.kpi.hw}%</b></div><div class="data-point"><span class="circleicon">${icon('layers',14)}</span>Проблемні уроки / модулі: <b>потрібні дані</b></div></div><div class="divider"></div><h3>Сигнали</h3><div class="section-spacer">${productSignals(p)}</div></div></div>`;
 if(kind==='teachers')return `<div class="panel-grid"><div class="panel"><h3>Порівняння груп і викладачів</h3><p class="section-sub">Показано лише вигадані індикатори, без рейтингу реальних людей.</p><table class="small-table"><thead><tr><th>Умовна група</th><th>Учнів</th><th>COR</th><th>Відвідуваність</th></tr></thead><tbody>${p.cohorts.slice(0,4).map((x,i)=>`<tr><td>Група ${i+1}</td><td>${x[1]}</td><td>${Math.max(55,Math.min(97,p.kpi.cor+(i-1)*5))}%</td><td>${x[2]}%</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Як інтерпретувати</h3><ul class="bullets"><li>Не порівнювати викладачів без урахування віку й складу когорт</li><li>Виявляти незвично великий розкид між подібними групами</li><li>Перевіряти зміни викладача на перших місяцях</li><li>Порівнювати навчальні сценарії й фідбек до занять</li></ul></div></div>`;
 if(kind==='experience')return `<div class="panel-grid"><div class="panel"><h3>Клієнтський досвід</h3><div class="kpi-val">${p.missing.includes('experience')?'Недостатньо даних':p.kpi.nps}</div><p class="section-sub">Демо-показник NPS / оцінок. Формулу, шкалу й частку відповідей потрібно узгодити.</p><div class="notice">Окремо варто показувати позитивні та негативні відгуки, теми звернень і динаміку за місяцями.</div></div><div class="panel"><h3>Що перевіряти</h3><ul class="bullets"><li>Чи відображено відгуки батьків і дітей окремо</li><li>Частку відповідей та неупередженість вибірки</li><li>Скарги з CRM і якість їхньої класифікації</li><li>Зв’язок негативних коментарів з конкретними уроками</li></ul></div></div>`;
 return `<div class="panel-grid"><div class="panel"><h3>Комерційний стан курсу</h3><div class="kpi-val">${p.kpi.sales}</div><p class="section-sub">Нові продажі за умовний жовтень 2026</p><div class="notice">Попит, лідогенерація, конверсія та середній чек — важливий бізнес-контекст, але не автоматична оцінка якості навчальної програми.</div></div><div class="panel"><h3>Додаткові розрізи</h3><ul class="bullets"><li>Кількість лідів і динаміка по каналах</li><li>Конверсія в запис і оплату</li><li>Наповнюваність груп, вільні місця, розклад</li><li>План / факт та економіка курсу</li><li>Переведення клієнтів між напрямами — окремий портфельний зріз</li></ul><div class="section-spacer">${productSignals(p)}</div></div></div>`
}
function tabPane(p){return tabPaneContent(p)+zohoLinks(p,state.tab)}
function passport(){let p=P(state.prod)||PRODUCTS[0],focus=S(state.signal),focusValid=focus&&focus.prod===p.id&&signalEligible(focus); layout(`<button class="back-link" data-back="1" type="button">${icon('back',19)} Назад</button><div class="detail-breadcrumb"><button data-nav="${state.lastTop==='map'?'map':'attention'}">${state.lastTop==='map'?'Карта продуктів':'Центр уваги'}</button>${icon('chev',13)} <button data-open-direction="${p.direction}">${Direction(p.direction)?.name||'Напрям'}</button>${icon('chev',13)} <span>Паспорт продукту</span></div><div class="product-hero"><div><div class="prod-big">${p.name}</div><div class="info-row"><span class="info-pill">${Direction(p.direction)?.name} / ${p.segment}</span><span class="info-pill">${fmt(p.students)} учнів</span><span class="info-pill">${p.groups} груп</span><span class="info-pill">${p.courses}</span></div></div><div class="actions">${statusDot(overallStatus(p))}<b style="font-size:12px;color:${statusColor(overallStatus(p))}">${statusName(overallStatus(p))}</b><button class="btn sm" data-nav="map">${icon('grid',13)} Усі курси</button></div></div>${focusValid?`<div class="notice" style="margin-bottom:18px;background:${focus.kind==='positive'?'#edf9f4':'#fff4f1'};border-color:${focus.kind==='positive'?'#d5eee0':'#f6ded9'}"><div class="row-flex"><div><b>${focus.kind==='positive'?'Позитивний сигнал':'Сигнал уваги'}: ${focus.title}</b><div style="font-size:11px;margin-top:5px">${signalChange(focus)} · ${focus.metric} · ${focus.cohort}</div></div><button class="btn sm primary" data-open-diagnostic="${focus.id}">Діагностика ${icon('arrow',14)}</button></div></div>`:''}${kpis(p)}${aiProductOverview(p)}<div class="tabs">${[['overview','Огляд'],['retention','Утримання'],['engagement','Залученість'],['teachers','Викладачі'],['experience','Клієнтський досвід'],['business','Комерція']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</div>${tabPane(p)}`)}
function diagnostics(){let s=S(state.signal);if(!s){state.view='attention';return attention()}let p=P(s.prod),pos=s.kind==='positive';let c0=s.before, c1=s.after, max=Math.max(c0,c1,1),vmax=Math.ceil(max*1.2);layout(`<button class="back-link" data-back="1" type="button">${icon('back',19)} Назад</button><div class="detail-breadcrumb"><button data-nav="${state.lastTop==='map'?'map':'attention'}">${state.lastTop==='map'?'Карта продуктів':'Центр уваги'}</button>${icon('chev',13)}<button data-open-product="${p.id}" data-focus="${s.id}">${p.name}</button>${icon('chev',13)}<span>Діагностика сигналу</span></div><div class="diagnostic-head"><div class="row-flex"><span class="tag ${pos?'positive':'negative'}">${signalLabel(s)} · ${DIM[s.dim].label}</span><span class="tag">Дані демонстраційні</span></div><div class="diagnostic-title">${s.title}</div><div style="color:var(--muted);font-size:13px">${p.name} · ${s.cohort}</div><div class="diag-metric"><span class="diag-delta ${pos?'pos':''}">${signalChange(s)}</span><span style="color:var(--muted)">${s.metric}: ${signalDiff(s)} · вибірка ${s.sample} ${s.sampleType}</span></div><p class="diag-explain">${s.summary}</p></div>${aiDiagnostic(s)}<div class="diagnostic-grid"><div><div class="panel"><div class="row-flex"><h3>Що змінилося</h3><span class="tag">Порівняння періодів</span></div><div style="display:flex;align-items:end;gap:40px;height:175px;padding:24px 45px 5px;border-bottom:1px solid var(--line)">${[[c0,'Було','#bfc1d1'],[c1,'Стало',pos?'#41a58b':'#df8a85']].map(([n,lab,color])=>`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px;flex:1;max-width:130px"><b style="font-size:12px">${n}${s.mode==='pp'?'%':''}</b><div style="width:70%;max-width:72px;min-height:5px;height:${Math.max(6,n/vmax*118)}px;border-radius:8px 8px 0 0;background:${color}"></div><span style="font-size:11px;color:var(--muted)">${lab}</span></div>`).join('')}</div><div class="notice"><b>Інтерпретація:</b> на графіку показано відхилення. Сама по собі одночасна зміна кількох показників не доводить причинно-наслідкового зв’язку.</div></div></div><aside class="rail"><div class="panel"><h3>Джерела для перевірки</h3><div class="source-list">${s.source.map(t=>`<div class="source"><b>${icon('link',13)} ${esc(t)}</b>Назва прикладова. Потрібно погодити доступ і поля джерела.</div>`).join('')}</div></div>${zohoLinks(p,({retention:'retention',engagement:'engagement',learning:'teachers',experience:'experience',business:'business',operations:'business'})[s.dim]||'overview')}<div class="panel"><h3>Контекст сигналу</h3><div class="data-point-list"><div class="data-point">${icon('users',16)} Вибірка: <b>${s.sample} ${s.sampleType}</b></div><div class="data-point">${icon('sliders',16)} Тестовий поріг: <b>${s.mode==='pp'?`±${state.threshold} в.п.`:'±10%'}</b></div><div class="data-point">${icon('clock',16)} Період: <b>жовтень 2026</b></div></div><div class="divider"></div><button class="btn primary" style="width:100%" data-open-product="${p.id}" data-focus="${s.id}">Повернутися до паспорта ${icon('arrow',14)}</button></div><div class="callout">Важливо: реальна система повинна показувати дату оновлення джерел, правила порівняння, знаменник, якість даних і доступ до деталізації.</div></aside></div>`)}

document.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-dim')){state.dim=el.value;render()}if(el.hasAttribute('data-attention-direction')){state.attentionDirection=el.value;render()}if(el.hasAttribute('data-threshold')){state.threshold=Number(el.value);render()}if(el.hasAttribute('data-minsample')){state.minSample=Number(el.value);render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.search){let k=el.dataset.search,at=el.selectionStart;if(k==='attention')state.query=el.value;else state.mapQuery=el.value;render();let next=document.querySelector(`[data-search="${k}"]`);if(next){next.focus();next.setSelectionRange(at,at)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('zoho-modal')?.remove();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});

window.addEventListener('hashchange',()=>{const hash=decodeURIComponent(location.hash.slice(1));let desired=null;if(hash==='attention')desired='attention';else if(hash==='map')desired='map';else if(hash.startsWith('direction/')){const id=hash.split('/')[1];if(Direction(id)){state.direction=id;desired='direction'}}else if(hash.startsWith('product/')){const id=hash.split('/')[1];if(P(id)){state.prod=id;desired='passport'}}else if(hash.startsWith('signal/')){const id=hash.split('/')[1];if(S(id)){state.signal=id;state.prod=S(id).prod;desired='diagnostics'}}if(desired&&desired!==state.view){state.view=desired;render();window.scrollTo(0,0)}});
let hash=decodeURIComponent(location.hash.slice(1));if(hash==='map'){state.view='map';state.lastTop='map'}else if(hash.startsWith('direction/')){state.direction=hash.split('/')[1];if(Direction(state.direction))state.view='direction'}else if(hash.startsWith('product/')){state.prod=hash.split('/')[1];if(P(state.prod))state.view='passport'}else if(hash.startsWith('signal/')){state.signal=hash.split('/')[1];if(S(state.signal)){state.prod=S(state.signal).prod;state.view='diagnostics'}}
render();
