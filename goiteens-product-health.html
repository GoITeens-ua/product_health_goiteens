function signalColors(s){return s.kind==='positive'?'positive':'negative'}
function signalLabel(s){return s.kind==='positive'?'Покращення':'Потребує уваги'}
function topHeader(){let loc=state.view==='attention'?'Центр уваги':state.view==='map'?'Карта продуктів':state.view==='passport'?'Паспорт продукту':'Діагностика';return `<header class="topbar"><div class="crumb">Продуктова аналітика <span style="margin:0 7px">/</span> <b>${loc}</b></div><div class="top-right"><span class="pill">${icon('calendar',14)} Жовтень 2026</span><span class="pill demo">${icon('spark',13)} УМОВНІ ДАНІ</span></div></header>`}
function side(){return `<aside class="side"><div class="brand"><div class="brand-mark">g</div><div><div class="brand-name">GoITeens</div><div class="brand-caption">PRODUCT HEALTH</div></div></div><div class="nav-group-title">НАВІГАЦІЯ</div><button class="navlink ${state.view==='attention'?'active':''}" data-nav="attention">${icon('radar',19)} Центр уваги</button><button class="navlink ${state.view==='map'?'active':''}" data-nav="map">${icon('grid',19)} Карта продуктів</button><div class="side-bottom"><span class="demo-sign"><span class="mini-dot"></span> ІНТЕРАКТИВНИЙ ПРОТОТИП</span><p>Всі значення, відхилення, когорти та сигнали вигадані. Назви курсів наведено як приклад структури.</p><button class="btn sm" data-demo-help="1">${icon('info',14)} Як працює демо</button></div></aside>`}
function layout(html){E('app').innerHTML=`<div class="app">${side()}<main class="main">${topHeader()}<div class="content page-narrow">${html}</div><div class="footer">GoITeens · Product Health · концепт інтерфейсу v1.0 · усі дані демонстраційні</div></main></div>`}
function hero(){return `<section class="hero"><div><div class="eyebrow">${icon('radar',13)} ПРОДУКТОВІ СИГНАЛИ</div><h2>Побачити зміни. Зрозуміти, де потрібна дія.</h2><p>Важливі відхилення та покращення за курсами. Від сигналу — до продукту, когорти й даних для перевірки.</p></div><div class="hero-tip"><b>Ключовий принцип</b>Не всі зміни є проблемою. Враховуємо поріг, обсяг вибірки та контекст. Покращення теж варто досліджувати.</div></section>`}
function counters(a){let negative=a.filter(s=>s.kind==='negative'),positive=a.filter(s=>s.kind==='positive');let affected=new Set(negative.map(s=>s.prod)).size,seen=a.filter(s=>state.reviewed[s.id]).length;return `<div class="stat-grid"><div class="stat"><div class="stat-top">Сигналів уваги <span class="stat-icon" style="color:var(--red)">${icon('alert',16)}</span></div><div class="stat-num">${negative.length}</div><div class="stat-sub">відхилення, які варто перевірити</div></div><div class="stat"><div class="stat-top">Позитивних змін <span class="stat-icon" style="color:var(--green)">${icon('up',16)}</span></div><div class="stat-num">${positive.length}</div><div class="stat-sub">практики, які варто вивчити</div></div><div class="stat"><div class="stat-top">Курсів з ризиком <span class="stat-icon">${icon('book',16)}</span></div><div class="stat-num">${affected}</div><div class="stat-sub">із ${PRODUCTS.length} курсів у демо</div></div><div class="stat"><div class="stat-top">Переглянуто <span class="stat-icon">${icon('check',16)}</span></div><div class="stat-num">${seen}</div><div class="stat-sub">позначено в цьому браузері</div></div></div>`}
function attentionFilters(){return `<div class="card filters"><div class="seg"><button data-tone="all" class="${state.tone==='all'?'active':''}">Усі</button><button data-tone="negative" class="${state.tone==='negative'?'active':''}">${icon('alert',12)} Проблеми</button><button data-tone="positive" class="${state.tone==='positive'?'active':''}">${icon('up',12)} Покращення</button></div><select class="field" data-dim aria-label="Напрям сигналів"><option value="all" ${state.dim==='all'?'selected':''}>Усі напрями</option>${DIM_KEYS.map(k=>`<option value="${k}" ${state.dim===k?'selected':''}>${DIM[k].label}</option>`).join('')}</select><label class="search-wrap">${icon('search',14)}<input data-search="attention" placeholder="Знайти курс або сигнал" value="${esc(state.query)}" aria-label="Пошук сигналів"></label></div>`}
function signalCard(s){let p=P(s.prod),pos=s.kind==='positive',reviewed=state.reviewed[s.id];return `<article class="card signal ${pos?'positive':''}"><div class="stripe"></div><div><div class="signal-top"><div><div class="signal-company">${p.name}</div><div class="mini-meta">${DIM[s.dim].label} · ${s.cohort}</div></div><div class="badges"><span class="tag ${pos?'positive':'negative'}">${pos?icon('up',11):icon('alert',11)} ${signalLabel(s)}</span>${reviewed?'<span class="tag">Переглянуто</span>':''}</div></div><div class="signal-title">${s.title}</div><div class="metric-line"><span class="change">${signalChange(s)}</span><span class="quiet">${esc(s.metric)} · ${signalDiff(s)}</span></div><p class="explain">${esc(s.summary)}</p><div class="signal-footer"><span class="footnote">Основа: ${s.sample} ${s.sampleType} · ${s.source[0]}</span><div class="actions"><button class="btn text sm" data-review="${s.id}">${reviewed?'Скасувати позначку':icon('check',13)+' Переглянуто'}</button><button class="btn sm primary" data-open-product="${p.id}" data-focus="${s.id}">Відкрити в паспорті ${icon('arrow',14)}</button></div></div></div></article>`}
function ruleCard(){return `<div class="card rail-card"><div class="rail-header">${icon('sliders',17)}<h3>Демо-правила сигналів</h3></div><p>Змініть умовні пороги, щоб побачити, як вони впливають на «Центр уваги» та «Карту продуктів».</p><div class="rail-label"><span>Мінімальна зміна показника</span><b>±${state.threshold} в.п.</b></div><input class="range" type="range" min="2" max="10" step="1" value="${state.threshold}" data-threshold aria-label="Поріг зміни у відсоткових пунктах"><div class="rule-line"><span>Чутливіше · 2 в.п.</span><span>Суворіше · 10 в.п.</span></div><div class="rail-label"><span>Мінімальна вибірка</span><b>${state.minSample}</b></div><input class="range" type="range" min="15" max="100" step="5" value="${state.minSample}" data-minsample aria-label="Мінімальний розмір вибірки"><div class="rule-line"><span>15 спостережень</span><span>100 спостережень</span></div><div class="rail-summary"><span class="rule-flag"></span><b>Умовна логіка:</b> сигнал за зміною у відсоткових пунктах показуємо від заданого порогу та вибірки. Для відносної зміни кількості заявок у демо використано поріг 10%.</div><div class="divider"></div><button class="btn sm" data-reset="1">${icon('settings',13)} Відновити пороги</button></div>`}
function railHelp(){return `<div class="card rail-card"><div class="rail-header">${icon('info',17)}<h3>Як читати сигнали</h3></div><div class="data-point-list"><div class="data-point"><span class="circleicon" style="background:var(--redBg);color:var(--red)">${icon('trend',14)}</span><div><b>Потребує уваги</b><br>Помітне погіршення. Це сигнал для перевірки, а не встановлена причина.</div></div><div class="data-point"><span class="circleicon" style="background:var(--greenBg);color:var(--green)">${icon('up',14)}</span><div><b>Позитивна зміна</b><br>Варто зрозуміти, що спрацювало, і чи можна масштабувати результат.</div></div><div class="data-point"><span class="circleicon">${icon('layers',14)}</span><div><b>Деталізація</b><br>Перехід до когорт, місяців, викладачів, відгуків і першоджерел.</div></div></div></div>`}
function spotlights(a){let candidates=[a.find(s=>s.id==='mc-drop'),a.find(s=>s.id==='art-cor')];let fallback=[a.find(s=>s.kind==='negative'),a.find(s=>s.kind==='positive')];return `<div class="spotlights">${candidates.map((s,i)=>s||fallback[i]).filter(Boolean).map(s=>`<div class="spotlight ${s.kind==='positive'?'good':''}"><div><div class="spot-cap">${s.kind==='positive'?'↑ ПОКРАЩЕННЯ, ЯКЕ ВАРТО ДОСЛІДИТИ':'! СИГНАЛ, ЯКИЙ ВАРТО ПЕРЕВІРИТИ'}</div><div class="spot-title">${P(s.prod).name} · ${s.title}</div><div class="spot-meta">${s.metric} · ${signalDiff(s)}</div></div><div style="display:flex;align-items:center;gap:12px"><div class="spot-val">${signalChange(s)}</div><button class="btn sm" data-open-product="${s.prod}" data-focus="${s.id}">${icon('chev',14)}</button></div></div>`).join('')}</div>`}
function attention(){let a=activeSignals(), list=a.filter(s=>(state.tone==='all'||s.kind===state.tone)&&(state.dim==='all'||s.dim===state.dim)&&(!state.query||(P(s.prod).name+' '+s.title+' '+DIM[s.dim].label).toLocaleLowerCase('uk').includes(state.query.toLocaleLowerCase('uk'))));list.sort((a,b)=>{let first=x=>x.kind==='negative'?0:1;return first(a)-first(b)||Math.abs(b.delta)-Math.abs(a.delta)});let blocks=list.length?list.map(signalCard).join(''):`<div class="empty">${icon('search',33)}<h3>Сигналів за фільтрами немає</h3><p>Змініть напрям, пошук або демо-пороги.</p></div>`;layout(`<div class="heading-row"><div><h1>Центр уваги</h1><p class="lead">Зміни, які варто обговорити на продуктовому синку. Тут є і ризики, і позитивні результати.</p></div><button class="btn" data-nav="map">${icon('grid',15)} Переглянути всі продукти</button></div>${hero()}${counters(a)}${spotlights(a)}<div class="columns"><section><div class="section-head"><div><h2>Актуальні сигнали</h2><div class="section-sub">${list.length} із ${a.length} сигналів за поточними налаштуваннями</div></div></div>${attentionFilters()}<div class="feed">${blocks}</div></section><aside class="rail">${ruleCard()}${railHelp()}<div class="callout"><b>Важливо.</b> Усі пороги та сигнали в прототипі умовні. У робочій системі правила погоджуються для кожного показника й типу курсу, з урахуванням сезонності, обсягу вибірки та якості даних.</div></aside></div>`)}
function mapFilterBar(){return `<div class="map-top"><div class="seg"><button data-mapfilter="all" class="${state.mapFilter==='all'?'active':''}">Усі (${PRODUCTS.length})</button><button data-mapfilter="risk" class="${state.mapFilter==='risk'?'active':''}">Потребують уваги</button><button data-mapfilter="positive" class="${state.mapFilter==='positive'?'active':''}">Є покращення</button></div><label class="search-wrap" style="flex:0 1 270px">${icon('search',14)}<input data-search="map" placeholder="Пошук курсу" value="${esc(state.mapQuery)}" aria-label="Пошук курсів"></label><div style="margin-left:auto;display:flex;gap:6px"><button class="btn sm ${state.mapMode==='cards'?'primary':''}" data-mapmode="cards" aria-label="Картки">${icon('grid',15)}</button><button class="btn sm ${state.mapMode==='table'?'primary':''}" data-mapmode="table" aria-label="Таблиця">${icon('list',15)}</button></div></div>`}
function mapCard(p){let ss=overallStatus(p),cnt=activeSignals().filter(s=>s.prod===p.id).length;return `<article class="card product-card" tabindex="0" role="button" data-open-product="${p.id}" aria-label="Відкрити паспорт ${p.name}"><div class="row-flex"><div><div class="product-title">${p.name}</div><div class="product-meta">${p.segment}</div></div><span class="small-chip">${p.groups} груп</span></div><div class="product-status">${statusDot(ss)}<span style="color:${statusColor(ss)}">${statusName(ss)}</span></div><div class="dimension-grid">${DIM_KEYS.map(k=>{let v=dimensionStatus(p,k);return `<div class="dim"><div class="dim-left">${statusDot(v)}<span>${DIM[k].label}</span></div><span style="color:${statusColor(v)};font-weight:700;font-size:10px">${v==='risk'?'Сигнал':v==='positive'?'↑':v==='unknown'?'Н/Д':'—'}</span></div>`}).join('')}</div><div class="prod-foot"><span>${cnt?`${cnt} сигналів за період`:'Немає нових сигналів'}</span>${icon('arrow',16)}</div></article>`}
function mapTable(list){return `<div class="grid-table"><table class="data-table"><thead><tr><th>Продукт</th><th>Учнів</th>${DIM_KEYS.map(k=>`<th>${DIM[k].short}</th>`).join('')}<th></th></tr></thead><tbody>${list.map(p=>`<tr data-open-product="${p.id}"><td><b>${p.name}</b><div style="font-size:10px;color:var(--muted)">${p.segment}</div></td><td>${p.students}</td>${DIM_KEYS.map(k=>{let a=dimensionStatus(p,k);return `<td><span class="status-cell">${statusDot(a)}${a==='risk'?'Сигнал':a==='positive'?'Покращення':a==='unknown'?'Н/Д':'—'}</span></td>`}).join('')}<td>${icon('chev',15)}</td></tr>`).join('')}</tbody></table></div>`}
function map(){let p=PRODUCTS.filter(x=>(state.mapFilter==='all'||(state.mapFilter==='risk'&&DIM_KEYS.some(k=>dimensionStatus(x,k)==='risk'))||(state.mapFilter==='positive'&&DIM_KEYS.some(k=>dimensionStatus(x,k)==='positive')))&&(!state.mapQuery||x.name.toLocaleLowerCase('uk').includes(state.mapQuery.toLocaleLowerCase('uk'))));layout(`<div class="heading-row"><div><h1>Карта продуктів</h1><p class="lead">Уся продуктова лінійка в одному місці. Окремі статуси за напрямами — без непрозорого загального Health Score.</p></div><button class="btn" data-nav="attention">${icon('radar',15)} До Центру уваги</button></div><div class="card" style="padding:16px 18px;margin-bottom:18px"><div class="row-flex"><div><b>${PRODUCTS.length} курсів</b> <span style="color:var(--muted);font-size:12px;margin-left:7px">демонстраційний продуктовий портфель</span></div><span class="tag">Освітні та комерційні показники не змішуються</span></div><div class="color-legend" style="margin:11px 0 0"><span class="legend-item">${statusDot('risk')} Потребує уваги</span><span class="legend-item">${statusDot('positive')} Покращення</span><span class="legend-item">${statusDot('stable')} Немає нових сигналів</span><span class="legend-item">${statusDot('unknown')} Недостатньо даних</span></div></div>${mapFilterBar()}${p.length?(state.mapMode==='cards'?`<div class="map-grid">${p.map(mapCard).join('')}</div>`:mapTable(p)):'<div class="empty"><h3>Курсів не знайдено</h3><p>Спробуйте інший фільтр або запит.</p></div>'}<div class="notice">Статуси в цьому демо формуються на основі умовних сигналів і змінюються разом із демо-порогами. Відсутність сигналу не доводить, що курс ідеальний; у реальній системі потрібні правила якості даних.</div>`)}
function plotSVG(points,{pos=false,labels=true}={}){let w=540,h=170,pad=14,min=Math.min(...points)-6,max=Math.max(...points)+6,ys=y=>h-pad-(y-min)/(max-min)*(h-pad*2),xs=i=>pad+i*(w-2*pad)/(points.length-1),path=points.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(2)} ${ys(v).toFixed(2)}`).join(' '),col=pos?'#2c9f7e':'#8066e8';return `<svg class="viz" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Демонстраційний графік динаміки">${[0,1,2,3].map(i=>`<line x1="0" y1="${25+i*40}" x2="540" y2="${25+i*40}" stroke="#eef0f4" stroke-width="1" stroke-dasharray="4 5"/>`).join('')}<path d="${path}" stroke="${col}" stroke-width="3" stroke-linejoin="round" fill="none"/>${points.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="4" fill="white" stroke="${col}" stroke-width="2.5"/>`).join('')}</svg>${labels?'<div class="viz-labels"><span>Квітень</span><span>Травень</span><span>Червень</span><span>Липень</span><span>Серпень</span><span>Вересень</span><span>Жовтень</span></div>':''}`}
function kpis(p){let k=p.kpi,items=[['COR',k.cor+'%','Демонстраційний показник утримання'],['Дроп 1-го місяця',k.drop+'%','Окрема метрика раннього відтоку'],['Відвідуваність',k.attendance+'%','Частка відвіданих занять'],['Виконання ДЗ',k.hw+'%','Завдання, виконані учнями'],['NPS / досвід',p.missing.includes('experience')?'Н/Д':k.nps,'Доступність даних перевіряється'],['Нові продажі',k.sales,'Комерційний контекст']];return `<div class="kpi-grid">${items.map(x=>`<div class="kpi"><div class="kpi-name">${x[0]}</div><div class="kpi-val">${x[1]}</div><div class="kpi-compare">${x[2]}</div></div>`).join('')}</div>`}
function productSignals(p){let a=activeSignals().filter(s=>s.prod===p.id);return a.length?`<div class="mini-signals">${a.map(s=>`<div class="mini-signal"><div><b style="color:${s.kind==='positive'?'var(--green)':'var(--red)'}">${signalChange(s)} · ${s.metric}</b><p>${s.title}</p></div><button class="btn sm" data-open-diagnostic="${s.id}">${icon('search',13)} Деталі</button></div>`).join('')}</div>`:'<p class="lead">За поточними демо-порогами нових сигналів немає.</p>'}
function cohortTable(p){return `<table class="small-table"><thead><tr><th>Когорта</th><th>Учні</th><th>Відвід.</th><th>ДЗ</th></tr></thead><tbody>${p.cohorts.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}%</td><td>${x[3]}%</td></tr>`).join('')}</tbody></table>`}
function tabPane(p){let signals=activeSignals().filter(s=>s.prod===p.id),kind=state.tab; if(kind==='overview')return `<div class="panel-grid"><div class="panel"><div class="row-flex"><h3>Динаміка COR за 7 місяців</h3><span class="tag">Демо</span></div>${plotSVG(p.trend)}<div class="notice">На відміну від LTV компанії, COR відображається саме для цього курсу. Формула та правила порівняння ще мають бути погоджені.</div></div><div class="panel"><h3>Сигнали курсу</h3><p class="section-sub" style="margin-bottom:14px">Відкрийте будь-яку зміну для деталізації</p>${productSignals(p)}</div></div><div class="panel section-spacer"><h3>Розподіл за когортами</h3>${cohortTable(p)}<div class="section-sub" style="margin-top:10px">Це приклад деталізації — значення не пов’язані з реальними учнями GoITeens.</div></div>`;
 if(kind==='retention')return `<div class="panel-grid"><div class="panel"><h3>Утримання за місяцями</h3>${plotSVG(p.trend)}<p class="section-sub">Важливо відокремлювати незапланований дроп, випуск та перехід на інший курс.</p><div class="section-spacer"><h3>Утримання і ранній дроп</h3><div class="data-point-list"><div class="data-point">${icon('bars',16)} COR: <b>${p.kpi.cor}%</b></div><div class="data-point">${icon('alert',16)} Дроп першого місяця: <b>${p.kpi.drop}%</b></div></div></div></div><div class="panel"><h3>Що перевіряти</h3><ul class="bullets"><li>Порівняння коректних когорт, у тому числі розміру вибірки</li><li>Розподіл відтоку за місяцями й модулями</li><li>Причини виходу, завершення та міграції</li><li>Початковий вибір курсу клієнтом</li></ul><h3 style="margin-top:22px">Доступні сигнали</h3><div class="section-spacer">${productSignals(p)}</div></div></div>`;
 if(kind==='engagement')return `<div class="panel-grid"><div class="panel"><h3>Активність учнів за когортами</h3>${cohortTable(p)}<p class="section-sub" style="margin-top:10px">У робочій версії — деталізація за уроками й модулями.</p></div><div class="panel"><h3>Індикатори залученості</h3><div class="data-point-list"><div class="data-point"><span class="circleicon">${icon('calendar',14)}</span>Відвідуваність: <b>${p.kpi.attendance}%</b></div><div class="data-point"><span class="circleicon">${icon('check',14)}</span>Виконання ДЗ: <b>${p.kpi.hw}%</b></div><div class="data-point"><span class="circleicon">${icon('layers',14)}</span>Проблемні уроки / модулі: <b>потрібні дані</b></div></div><div class="divider"></div><h3>Сигнали</h3><div class="section-spacer">${productSignals(p)}</div></div></div>`;
 if(kind==='teachers')return `<div class="panel-grid"><div class="panel"><h3>Порівняння груп і викладачів</h3><p class="section-sub">Показано лише вигадані індикатори, без рейтингу реальних людей.</p><table class="small-table"><thead><tr><th>Умовна група</th><th>Учнів</th><th>COR</th><th>Відвідуваність</th></tr></thead><tbody>${p.cohorts.slice(0,4).map((x,i)=>`<tr><td>Група ${i+1}</td><td>${x[1]}</td><td>${Math.max(55,Math.min(97,p.kpi.cor+(i-1)*5))}%</td><td>${x[2]}%</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>Як інтерпретувати</h3><ul class="bullets"><li>Не порівнювати викладачів без урахування віку й складу когорт</li><li>Виявляти незвично великий розкид між подібними групами</li><li>Перевіряти зміни викладача на перших місяцях</li><li>Порівнювати навчальні сценарії й фідбек до занять</li></ul></div></div>`;
 if(kind==='experience')return `<div class="panel-grid"><div class="panel"><h3>Клієнтський досвід</h3><div class="kpi-val">${p.missing.includes('experience')?'Недостатньо даних':p.kpi.nps}</div><p class="section-sub">Демо-показник NPS / оцінок. Формулу, шкалу й частку відповідей потрібно узгодити.</p><div class="notice">Окремо варто показувати позитивні та негативні відгуки, теми звернень і динаміку за місяцями.</div></div><div class="panel"><h3>Що перевіряти</h3><ul class="bullets"><li>Чи відображено відгуки батьків і дітей окремо</li><li>Частку відповідей та неупередженість вибірки</li><li>Скарги з CRM і якість їхньої класифікації</li><li>Зв’язок негативних коментарів з конкретними уроками</li></ul></div></div>`;
 return `<div class="panel-grid"><div class="panel"><h3>Комерційний стан курсу</h3><div class="kpi-val">${p.kpi.sales}</div><p class="section-sub">Нові продажі за умовний жовтень 2026</p><div class="notice">Попит, лідогенерація, конверсія та середній чек — важливий бізнес-контекст, але не автоматична оцінка якості навчальної програми.</div></div><div class="panel"><h3>Додаткові розрізи</h3><ul class="bullets"><li>Кількість лідів і динаміка по каналах</li><li>Конверсія в запис і оплату</li><li>Наповнюваність груп, вільні місця, розклад</li><li>План / факт та економіка курсу</li><li>Переведення клієнтів між напрямами — окремий портфельний зріз</li></ul><div class="section-spacer">${productSignals(p)}</div></div></div>`
}
function passport(){let p=P(state.prod)||PRODUCTS[0],focus=S(state.signal),focusValid=focus&&focus.prod===p.id&&signalEligible(focus); layout(`<div class="detail-breadcrumb"><button data-nav="${state.lastTop==='map'?'map':'attention'}">${state.lastTop==='map'?'Карта продуктів':'Центр уваги'}</button>${icon('chev',13)} <span>Паспорт продукту</span></div><div class="product-hero"><div><div class="prod-big">${p.name}</div><div class="info-row"><span class="info-pill">${p.segment}</span><span class="info-pill">${fmt(p.students)} учнів</span><span class="info-pill">${p.groups} груп</span><span class="info-pill">${p.courses}</span></div></div><div class="actions">${statusDot(overallStatus(p))}<b style="font-size:12px;color:${statusColor(overallStatus(p))}">${statusName(overallStatus(p))}</b><button class="btn sm" data-nav="map">${icon('grid',13)} Усі курси</button></div></div>${focusValid?`<div class="notice" style="margin-bottom:18px;background:${focus.kind==='positive'?'#edf9f4':'#fff4f1'};border-color:${focus.kind==='positive'?'#d5eee0':'#f6ded9'}"><div class="row-flex"><div><b>${focus.kind==='positive'?'Позитивний сигнал':'Сигнал уваги'}: ${focus.title}</b><div style="font-size:11px;margin-top:5px">${signalChange(focus)} · ${focus.metric} · ${focus.cohort}</div></div><button class="btn sm primary" data-open-diagnostic="${focus.id}">Діагностика ${icon('arrow',14)}</button></div></div>`:''}${kpis(p)}<div class="tabs">${[['overview','Огляд'],['retention','Утримання'],['engagement','Залученість'],['teachers','Викладачі'],['experience','Клієнтський досвід'],['business','Комерція']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('')}</div>${tabPane(p)}`)}
function diagnostics(){let s=S(state.signal);if(!s){state.view='attention';return attention()}let p=P(s.prod),pos=s.kind==='positive';let c0=s.before, c1=s.after, max=Math.max(c0,c1,1),vmax=Math.ceil(max*1.2);layout(`<div class="detail-breadcrumb"><button data-nav="${state.lastTop==='map'?'map':'attention'}">${state.lastTop==='map'?'Карта продуктів':'Центр уваги'}</button>${icon('chev',13)}<button data-open-product="${p.id}" data-focus="${s.id}">${p.name}</button>${icon('chev',13)}<span>Діагностика сигналу</span></div><div class="diagnostic-head"><div class="row-flex"><span class="tag ${pos?'positive':'negative'}">${signalLabel(s)} · ${DIM[s.dim].label}</span><span class="tag">Дані демонстраційні</span></div><div class="diagnostic-title">${s.title}</div><div style="color:var(--muted);font-size:13px">${p.name} · ${s.cohort}</div><div class="diag-metric"><span class="diag-delta ${pos?'pos':''}">${signalChange(s)}</span><span style="color:var(--muted)">${s.metric}: ${signalDiff(s)} · вибірка ${s.sample} ${s.sampleType}</span></div><p class="diag-explain">${s.summary}</p></div><div class="diagnostic-grid"><div><div class="panel"><div class="row-flex"><h3>Що змінилося</h3><span class="tag">Порівняння періодів</span></div><div style="display:flex;align-items:end;gap:40px;height:175px;padding:24px 45px 5px;border-bottom:1px solid var(--line)">${[[c0,'Було','#bfc1d1'],[c1,'Стало',pos?'#41a58b':'#df8a85']].map(([n,lab,color])=>`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px;flex:1;max-width:130px"><b style="font-size:12px">${n}${s.mode==='pp'?'%':''}</b><div style="width:70%;max-width:72px;min-height:5px;height:${Math.max(6,n/vmax*118)}px;border-radius:8px 8px 0 0;background:${color}"></div><span style="font-size:11px;color:var(--muted)">${lab}</span></div>`).join('')}</div><div class="notice"><b>Інтерпретація:</b> на графіку показано відхилення. Сама по собі одночасна зміна кількох показників не доводить причинно-наслідкового зв’язку.</div></div><div class="panel section-spacer"><h3>Що вже видно у даних</h3><ul class="bullets">${s.why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel section-spacer"><h3>Що потрібно перевірити</h3><ul class="bullets">${s.check.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="notice">Це перелік гіпотез та перевірок для демонстрації. Робочий AI-аналітик має спиратися на фактичні дані та явно позначати рівень упевненості.</div></div></div><aside class="rail"><div class="panel"><h3>Джерела для перевірки</h3><div class="source-list">${s.source.map(t=>`<div class="source"><b>${icon('link',13)} ${esc(t)}</b>Назва прикладова. Потрібно погодити доступ і поля джерела.</div>`).join('')}</div></div><div class="panel"><h3>Контекст сигналу</h3><div class="data-point-list"><div class="data-point">${icon('users',16)} Вибірка: <b>${s.sample} ${s.sampleType}</b></div><div class="data-point">${icon('sliders',16)} Демо-поріг: <b>${s.mode==='pp'?`±${state.threshold} в.п.`:'±10%'}</b></div><div class="data-point">${icon('clock',16)} Період: <b>жовтень 2026</b></div></div><div class="divider"></div><button class="btn primary" style="width:100%" data-open-product="${p.id}" data-focus="${s.id}">Повернутися до паспорта ${icon('arrow',14)}</button></div><div class="callout">Важливо: реальна система повинна показувати дату оновлення джерел, правила порівняння, знаменник, якість даних і доступ до деталізації.</div></aside></div>`)}
function render(){if(state.view==='attention')attention();else if(state.view==='map')map();else if(state.view==='passport')passport();else diagnostics();}
function navigate(view){state.view=view;if(view==='attention'||view==='map')state.lastTop=view;render();window.scrollTo(0,0);location.hash=view==='attention'?'attention':view==='map'?'map':view==='passport'?`product/${state.prod}`:`signal/${state.signal}`;}
function help(){let notice=document.createElement('div');notice.className='toast';notice.textContent='Демо працює без сервера: фільтри, пороги, навігація та деталізація інтерактивні. Усі дані вигадані; Zoho та AI ще не підключено.';document.body.appendChild(notice);setTimeout(()=>notice.remove(),4500)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-tone],[data-open-product],[data-open-diagnostic],[data-review],[data-mapfilter],[data-mapmode],[data-tab],[data-reset],[data-demo-help]');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.tone){state.tone=b.dataset.tone;render();return}if(b.dataset.openProduct){state.prod=b.dataset.openProduct;state.signal=b.dataset.focus||'';state.tab=state.signal&&S(state.signal)?({retention:'retention',engagement:'engagement',learning:'teachers',experience:'experience',business:'business',operations:'overview'})[S(state.signal).dim]:'overview';navigate('passport');return}if(b.dataset.openDiagnostic){state.signal=b.dataset.openDiagnostic;state.prod=S(state.signal).prod;navigate('diagnostics');return}if(b.dataset.review){state.reviewed[b.dataset.review]=!state.reviewed[b.dataset.review];try{localStorage.setItem('ph-demo-reviewed',JSON.stringify(state.reviewed))}catch(e){}render();return}if(b.dataset.mapfilter){state.mapFilter=b.dataset.mapfilter;render();return}if(b.dataset.mapmode){state.mapMode=b.dataset.mapmode;render();return}if(b.dataset.tab){state.tab=b.dataset.tab;render();return}if(b.dataset.reset){state.threshold=5;state.minSample=30;render();return}if(b.dataset.demoHelp){help();return}});
document.addEventListener('change',e=>{const el=e.target;if(el.hasAttribute('data-dim')){state.dim=el.value;render()}if(el.hasAttribute('data-threshold')){state.threshold=Number(el.value);render()}if(el.hasAttribute('data-minsample')){state.minSample=Number(el.value);render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.search){let k=el.dataset.search,at=el.selectionStart;if(k==='attention')state.query=el.value;else state.mapQuery=el.value;render();let next=document.querySelector(`[data-search="${k}"]`);if(next){next.focus();next.setSelectionRange(at,at)}}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-open-product]')){e.preventDefault();e.target.click()}});
try{state.reviewed=JSON.parse(localStorage.getItem('ph-demo-reviewed')||'{}')}catch(e){}
let hash=decodeURIComponent(location.hash.slice(1));if(hash==='map'){state.view='map';state.lastTop='map'}else if(hash.startsWith('product/')){state.prod=hash.split('/')[1];if(P(state.prod))state.view='passport'}else if(hash.startsWith('signal/')){state.signal=hash.split('/')[1];if(S(state.signal)){state.prod=S(state.signal).prod;state.view='diagnostics'}}
render();
</script></body></html>
